<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>需求入库系统</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafrex/spa-github-pages
      // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
      // ----------------------------------------------------------------------
      // This script checks to see if a redirect is needed.
      var pathname = window.location.pathname;
      if (pathname.substr(-1) === '/' || pathname.indexOf('.') > -1) {
        // If pathname ends with '/' or contains a '.', we don't redirect
        // because it's likely a file or already has a proper route
      } else {
        // Otherwise, redirect to pathname + '/' to allow GitHub Pages to serve index.html
        window.location.pathname = pathname + '/';
      }
    </script>
    <meta http-equiv="refresh" content="0; URL=/" />
  </head>
  <body>
  </body>
</html>
